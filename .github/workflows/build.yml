name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev \
            libltdl-dev ccache

      - name: Install Buildozer and Downgrade Virtualenv
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # මෙම පේළිය මඟින් ඉහත පැමිණි ImportError දෝෂය ස්ථිරවම නිරාකරණය කරයි
          python -m pip install "virtualenv<20.26.1"
          python -m pip install "Cython==0.29.36" buildozer

      - name: Configure Android SDK licenses
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found in repository root."
            exit 1
          fi

          if grep -q '^[[:space:]]*android.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i \
              's/^[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
